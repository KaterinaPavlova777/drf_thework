name: Django CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 080201
          POSTGRES_DB: coursework_drf
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        # Добавлено ожидание готовности
        steps: [ { run: dockerize -wait tcp://localhost:5432 -timeout 1m } ]

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:080201@localhost:5432/coursework_drf
      CELERY_BROKER_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: django-insecure-*@i#y2gl3--=i$z$hb1%t-nm=jx@6tr7(55uniahl8#c!&b6vt
      DJANGO_SETTINGS_MODULE: Restapimodel.settings

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi --no-root
          pip install django-celery-beat psycopg2-binary

      - name: Wait for PostgreSQL
        run: |
          pip install dockerize
          dockerize -wait tcp://localhost:5432 -timeout 1m

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/drf_thework-app:${{ github.sha }} .
          docker tag ${{ secrets.DOCKER_HUB_USERNAME }}/drf_thework-app:${{ github.sha }} ${{ secrets.DOCKER_HUB_USERNAME }}/drf_thework-app:latest

      - name: Push Docker image to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/drf_thework-app:${{ github.sha }}
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/drf_thework-app:latest

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Verify server structure
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "mkdir -p ~/drf_thework-app"

      - name: Prepare deployment files
        run: |
          echo "DATABASE_URL=postgresql://postgres:080201@db:5432/coursework_drf" > .env
          echo "CELERY_BROKER_URL=redis://redis:6379/0" >> .env
          echo "DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" >> .env
          chmod 600 .env

      - name: Sync necessary files
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
            ./docker-compose.yml \
            ./.env \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:~/drf_thework-app/

      - name: Deploy application
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << EOF
            cd ~/drf_thework-app
            echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | \
              docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

            docker compose down --remove-orphans
            docker compose pull
            docker compose up -d --build

            docker compose ps
          EOF