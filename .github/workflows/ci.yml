name: Django CI/CD Pipeline

on: [push, pull_request]

jobs:

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/lera:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/lera:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Verify server structure
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "ls -la ~/lera"

      - name: Prepare deployment files
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          chmod 600 .env

      - name: Sync necessary files
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
            ./docker-compose.yml \
            ./.env \
            ./nginx \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:~/lera/

      - name: Deploy application
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << EOF
            cd ~/lera
            echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | \
              docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

            docker compose down --remove-orphans
            docker compose pull
            docker compose up -d --build

            docker compose ps
          EOF